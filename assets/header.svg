<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Selasey Gbeddy · Technical Product Owner &amp; Analyst | AI &amp; Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A52"/><stop offset=".6" stop-color="#1F4E8C"/><stop offset="1" stop-color="#2D6FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".55">
      <stop offset="0" stop-color="#9CC4F5" stop-opacity=".45"/><stop offset="1" stop-color="#9CC4F5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>

  <!-- product flow line: listen, specify, build, ship -->
  <g fill="none" stroke="#9CC4F5" stroke-opacity=".55" stroke-width="2">
    <path d="M760 190 C 840 150, 900 210, 980 170 S 1110 140, 1150 120" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#0E2A52" stroke="#9CC4F5" stroke-width="2">
    <circle cx="760" cy="190" r="7"/><circle cx="880" cy="182" r="7"/><circle cx="1015" cy="160" r="7"/>
    <circle cx="1150" cy="120" r="9" fill="#9CC4F5">
      <animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#CFE0F7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
    <text x="760" y="218" text-anchor="middle">LISTEN</text>
    <text x="880" y="210" text-anchor="middle">SPECIFY</text>
    <text x="1015" y="188" text-anchor="middle">BUILD WITH AI</text>
    <text x="1150" y="100" text-anchor="middle">SHIP</text>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="64" y="84" fill="#9CC4F5" font-size="15" font-weight="700" letter-spacing="4">TECHNICAL PRODUCT OWNER &amp; ANALYST · AI &amp; AUTOMATION</text>
    <text x="62" y="152" fill="#FFFFFF" font-size="58" font-weight="800">Selasey Gbeddy</text>
    <text x="64" y="196" fill="#E6EEF9" font-size="21" font-weight="500">I turn business processes into <tspan fill="#9CC4F5" font-weight="700">shipped software.</tspan></text>
  </g>
</svg>
